name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
