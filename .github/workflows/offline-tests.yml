name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install DLNA test dependency
        run: sudo apt-get update && sudo apt-get install -y libtinyxml2-dev
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DBUILD_TESTING=ON
          -DBFPLAYER_BUILD_DLNA_INTEGRATION_TESTS=ON
      - name: Build
        run: cmake --build build/ci
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
