name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install DLNA test dependency
        run: sudo apt-get update && sudo apt-get install -y libtinyxml2-dev
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DBUILD_TESTING=ON
          -DBFPLAYER_BUILD_DLNA_INTEGRATION_TESTS=ON
      - name: Build
        run: cmake --build build/ci
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libtinyxml2-dev
      - name: Configure
        run: >-
          cmake -S . -B build/sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DBUILD_TESTING=ON
          -DBFPLAYER_BUILD_DLNA_INTEGRATION_TESTS=ON
      - name: Build
        run: cmake --build build/sanitize
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitize --output-on-failure
